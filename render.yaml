# Render Blueprint — QuickCart API (Spring Boot) + Render Postgres. Frontend: Vercel.
# Variables marked `sync: false` are prompted for in the Render dashboard when the Blueprint is applied.
services:
  - type: web
    name: quickcart-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Fit the JVM into the 512 MB free instance.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"

      # ---------- Database (Render Postgres below; the Dockerfile turns these into a JDBC URL)
      - key: DB_HOST
        fromDatabase: { name: quickcart-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: quickcart-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: quickcart-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: quickcart-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: quickcart-db, property: password }

      # ---------- Auth / cross-site cookies (frontend lives on Vercel)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL     # https://<your-app>.vercel.app
        sync: false
      - key: CORS_ORIGINS     # same as FRONTEND_URL
        sync: false

      # ---------- Social login
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI  # https://quickcart-api.onrender.com/login/oauth2/code/google
        sync: false

      # ---------- Payments (test mode)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UPI_SANDBOX_AUTO_CONFIRM
        value: "true"

      # ---------- Product images: admin uploads go to local disk, which Render wipes on each deploy.
      # Seeded catalogue photos ship with the frontend, so they are unaffected.
      - key: STORAGE_PROVIDER
        value: local

      # ---------- Email + chatbot
      - key: NOTIFICATIONS_ENABLED
        sync: false
      - key: NOTIFICATIONS_FROM
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AUTO_PROGRESS
        value: "true"

databases:
  - name: quickcart-db
    plan: free
    region: singapore
    databaseName: quickcart
    user: quickcart
    ipAllowList: []   # reachable only from Render services
