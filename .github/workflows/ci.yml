name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & unit tests
        run: mvn -B -ntp verify

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: '1'

  migrations:
    name: Database · Flyway migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: quickcart
          POSTGRES_USER: quickcart
          POSTGRES_PASSWORD: quickcart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickcart" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1…Vn in order
        env:
          PGPASSWORD: quickcart
        run: |
          for f in $(ls backend/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "▶ $f"
            psql -h localhost -U quickcart -d quickcart -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U quickcart -d quickcart -c "select count(*) as products from products;"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend & frontend images
        run: docker compose build backend frontend
